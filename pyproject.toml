[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sweep-disk"
version = "0.1.0"
description = "Reclaim your dev disk. Find and delete node_modules, .venv, target, build caches across every project — to the trash, reversibly."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "freyesperales" }]
keywords = [
    "node_modules", "disk", "cleanup", "cache", "venv", "cargo",
    "developer-tools", "cli", "tui", "npkill", "kondo",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Topic :: System :: Filesystems",
]
# Core is stdlib-only. send2trash is an optional, recommended enhancement for
# the most robust cross-platform "move to trash" behavior.
dependencies = []

[project.optional-dependencies]
trash = ["send2trash>=1.8"]
dev = ["pytest>=7.0", "mypy>=1.0"]

[project.urls]
Homepage = "https://github.com/freyesperales/sweep"
Repository = "https://github.com/freyesperales/sweep"

[project.scripts]
sweep = "sweep.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sweep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/sweep"]

[[tool.mypy.overrides]]
module = ["send2trash"]
ignore_missing_imports = true
